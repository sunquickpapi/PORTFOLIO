<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=1.0">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #F8FAFC;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    color: #0F172A;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .bg-glow {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.06;
  }
  .glow-1 { background: #3A99C9; top: -200px; left: -100px; }
  .glow-2 { background: #7c3aed; bottom: -200px; right: -100px; }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 4rem;
    align-items: center;
    padding: 0 4rem;
    width: 100%;
  }

  .left {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: rgba(58, 153, 201, 0.1);
    color: #3A99C9;
    padding: 0.4rem 1rem;
    border-radius: 99px;
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    width: fit-content;
  }

  h1 {
    font-size: 2.75rem;
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1.15;
  }
  h1 span { color: #3A99C9; }

  .desc {
    font-size: 1rem;
    color: #475569;
    line-height: 1.6;
    max-width: 420px;
  }

  .tags { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .tag {
    font-size: 0.7rem;
    font-weight: 700;
    padding: 0.3rem 0.7rem;
    border-radius: 6px;
    background: rgba(0,0,0,0.03);
    border: 1px solid rgba(0,0,0,0.06);
    color: #64748b;
  }

  .right {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
  }

  .demo-row {
    display: flex;
    gap: 1.5rem;
    align-items: center;
  }

  .pulse-glow {
    position: relative;
    padding: 0.9rem 2.2rem;
    border: none;
    border-radius: 14px;
    font-weight: 800;
    font-size: 0.9rem;
    cursor: pointer;
    color: white;
    animation: pulseGlow 2.5s ease-in-out infinite;
  }
  .pulse-glow::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: inherit;
    background: inherit;
    filter: blur(16px);
    opacity: 0;
    z-index: -1;
    animation: glowSpread 2.5s ease-in-out infinite;
  }

  .pulse-blue { background: linear-gradient(135deg, #3A99C9, #1B4F72); }
  .pulse-green { background: linear-gradient(135deg, #22c55e, #16a34a); animation-delay: 0.5s; }
  .pulse-green::after { animation-delay: 0.5s; }
  .pulse-purple { background: linear-gradient(135deg, #7c3aed, #a855f7); animation-delay: 1s; }
  .pulse-purple::after { animation-delay: 1s; }
  .pulse-red { background: linear-gradient(135deg, #ef4444, #f97316); animation-delay: 1.5s; }
  .pulse-red::after { animation-delay: 1.5s; }

  .pulse-badge {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #22c55e;
    animation: pulseGlow 2s ease-in-out infinite;
  }
  .pulse-badge::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: #22c55e;
    filter: blur(8px);
    opacity: 0;
    z-index: -1;
    animation: glowSpread 2s ease-in-out infinite;
  }

  .live-indicator {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    background: rgba(34, 197, 94, 0.08);
    border: 1px solid rgba(34, 197, 94, 0.15);
    border-radius: 99px;
    font-size: 0.75rem;
    font-weight: 700;
    color: #16a34a;
  }

  @keyframes pulseGlow {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 rgba(58, 153, 201, 0); }
    50% { transform: scale(1.03); box-shadow: 0 0 28px rgba(58, 153, 201, 0.35); }
  }
  @keyframes glowSpread {
    0%, 100% { opacity: 0; transform: scale(0.95); }
    50% { opacity: 0.5; transform: scale(1.05); }
  }
</style>
</head>
<body>
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>
  <div class="container">
    <div class="left">
      <div class="badge">✨ Animation</div>
      <h1>CSS Keyframe<br><span>Pulse Glow</span></h1>
      <p class="desc">Pure CSS pulsing glow animation with breathing light effect. Perfect for badges, live indicators, and CTAs.</p>
      <div class="tags">
        <span class="tag">#pulse</span>
        <span class="tag">#glow</span>
        <span class="tag">#keyframes</span>
        <span class="tag">#css-animation</span>
      </div>
    </div>
    <div class="right">
      <div class="demo-row">
        <button class="pulse-glow pulse-blue">Explore Work</button>
        <button class="pulse-glow pulse-green">Available</button>
      </div>
      <div class="demo-row">
        <button class="pulse-glow pulse-purple">Contact Me</button>
        <button class="pulse-glow pulse-red">Live Demo</button>
      </div>
      <div class="live-indicator">
        <span class="pulse-badge" style="position:relative;"></span>
        Currently Available
      </div>
    </div>
  </div>
</body>
</html>
