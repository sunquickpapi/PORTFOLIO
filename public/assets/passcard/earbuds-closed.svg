<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs>
  <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#cfd5da"/><stop offset=".12" stop-color="#f4f6f8"/><stop offset=".5" stop-color="#ffffff"/><stop offset=".86" stop-color="#eef1f4"/><stop offset="1" stop-color="#b9c1c8"/>
  </linearGradient>
  <linearGradient id="bodyV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".7" stop-color="#9aa4ad" stop-opacity=".0"/><stop offset="1" stop-color="#7d8892" stop-opacity=".45"/>
  </linearGradient>
  <linearGradient id="lidTop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8f99a3"/><stop offset=".35" stop-color="#e9edf0"/><stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e7ebee"/><stop offset="1" stop-color="#c3cad0"/>
  </linearGradient>
  <radialGradient id="cav" cx=".5" cy=".35" r=".7">
    <stop offset="0" stop-color="#9da6ae"/><stop offset=".7" stop-color="#bfc6cc"/><stop offset="1" stop-color="#d9dee2"/>
  </radialGradient>
  <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dfe4e8"/><stop offset="1" stop-color="#c9d0d6"/>
  </linearGradient>
  <radialGradient id="budHead" cx=".38" cy=".3" r=".8">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#eef1f4"/><stop offset="1" stop-color="#a9b2ba"/>
  </radialGradient>
  <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#c3cad1"/><stop offset=".35" stop-color="#ffffff"/><stop offset=".75" stop-color="#eef1f4"/><stop offset="1" stop-color="#aab3bb"/>
  </linearGradient>
  <radialGradient id="tip" cx=".4" cy=".35" r=".8">
    <stop offset="0" stop-color="#f3f5f7"/><stop offset=".6" stop-color="#d4dadf"/><stop offset="1" stop-color="#9ea8b1"/>
  </radialGradient>
  <clipPath id="caseClip"><rect x="26" y="62" width="148" height="120" rx="36"/></clipPath>
  <linearGradient id="lidLight" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".55" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="seamShade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8d98a3" stop-opacity="0"/><stop offset="1" stop-color="#8d98a3" stop-opacity=".18"/>
  </linearGradient>
  <filter id="blurS" x="-20%" y="-100%" width="140%" height="300%"><feGaussianBlur stdDeviation="2.5"/></filter>
</defs>
  <rect x="26" y="62" width="148" height="120" rx="36" fill="url(#body)"/>
  <rect x="26" y="62" width="148" height="120" rx="36" fill="url(#bodyV)"/>
  <rect x="26.5" y="62.5" width="147" height="119" rx="35.5" fill="none" stroke="#8d98a3" stroke-opacity=".45" stroke-width="1.2"/>
  <!-- lid: soft top-light, kept inside the case outline -->
  <g clip-path="url(#caseClip)">
    <rect x="26" y="62" width="148" height="42" fill="url(#lidLight)"/>
    <ellipse cx="100" cy="66" rx="58" ry="7" fill="#fff" opacity=".85" filter="url(#blurS)"/>
    <rect x="26" y="96" width="148" height="8" fill="url(#seamShade)"/>
  </g>
  <!-- lid seam -->
  <path d="M27 104 H173" stroke="#a8b1b9" stroke-width="1.2"/>
  <path d="M27 105.5 H173" stroke="#fff" stroke-width="1"/>
  <!-- edge glints -->
  <rect x="36" y="112" width="4" height="44" rx="2" fill="#fff" opacity=".9"/>
  <rect x="160" y="112" width="3" height="40" rx="1.5" fill="#fff" opacity=".7"/>
  <!-- status light -->
  <circle cx="100" cy="138" r="2.4" fill="#6fd38d"/>
  <circle cx="100" cy="138" r="5" fill="#6fd38d" opacity=".18"/>
</svg>
