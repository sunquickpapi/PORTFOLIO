<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e3135"/><stop offset=".45" stop-color="#151619"/><stop offset="1" stop-color="#0c0d0f"/>
    </linearGradient>
    <pattern id="weave" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="3" height="3" fill="none"/><path d="M0 0H3" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
    </pattern>
    <radialGradient id="shell" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#2f3237"/><stop offset=".5" stop-color="#121315"/><stop offset="1" stop-color="#060607"/>
    </radialGradient>
    <radialGradient id="cap" cx=".32" cy=".28" r=".9">
      <stop offset="0" stop-color="#3c4046"/><stop offset=".35" stop-color="#1b1c1f"/><stop offset=".8" stop-color="#0d0e10"/><stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a9097"/><stop offset=".3" stop-color="#2a2c30"/><stop offset=".6" stop-color="#121315"/><stop offset=".85" stop-color="#5d6268"/><stop offset="1" stop-color="#1a1b1e"/>
    </linearGradient>
    <radialGradient id="cushion" cx=".5" cy=".5" r=".55">
      <stop offset=".55" stop-color="#050506"/><stop offset=".78" stop-color="#1d1f22"/><stop offset=".92" stop-color="#2c2e32"/><stop offset="1" stop-color="#121315"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b6067"/><stop offset=".45" stop-color="#d9dde1"/><stop offset=".6" stop-color="#8d939a"/><stop offset="1" stop-color="#2b2e32"/>
    </linearGradient>
    <linearGradient id="yoke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34373c"/><stop offset=".5" stop-color="#141517"/><stop offset="1" stop-color="#26282c"/>
    </linearGradient>
    <linearGradient id="cushionSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050506"/><stop offset=".7" stop-color="#17181b"/><stop offset=".9" stop-color="#2a2c30"/><stop offset="1" stop-color="#0e0f11"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="112" cy="222" rx="86" ry="11" fill="rgba(13,42,66,.35)" filter="url(#soft)"/>

  <!-- far cup (right, seen from inside: cushion) -->
  <g transform="rotate(-12 158 168)">
    <ellipse cx="160" cy="170" rx="36" ry="47" fill="#0b0c0d"/>
    <ellipse cx="156" cy="170" rx="33" ry="44" fill="url(#cushion)"/>
    <ellipse cx="155" cy="171" rx="17" ry="25" fill="#030304"/>
    <path d="M128 150 Q132 128 152 124" stroke="rgba(255,255,255,.12)" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- headband -->
  <path id="bandPath" d="M168 126 C182 62 142 16 100 18 C62 20 40 52 52 98" stroke="url(#band)" stroke-width="24" fill="none" stroke-linecap="round"/>
  <path d="M168 126 C182 62 142 16 100 18 C62 20 40 52 52 98" stroke="url(#weave)" stroke-width="24" fill="none" stroke-linecap="round"/>
  <!-- band edge highlight + inner padding -->
  <path d="M157 110 C166 64 136 30 100 31 C70 33 52 58 61 92" stroke="#0a0a0b" stroke-width="6" fill="none" stroke-linecap="round" opacity=".9"/>
  <path d="M177 98 C182 58 148 8 100 7 C70 7 46 26 40 60" stroke="rgba(255,255,255,.16)" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- slider + hinge into the near cup -->
  <g transform="rotate(-14 58 106)">
    <rect x="48" y="92" width="20" height="20" rx="3" fill="url(#metal)"/>
    <rect x="48" y="92" width="20" height="20" rx="3" fill="none" stroke="rgba(0,0,0,.35)"/>
    <path d="M46 110 H70 L66 126 H50 Z" fill="url(#yoke)"/>
    <path d="M48 111 H68" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
  </g>
  <!-- near cup -->
  <g transform="rotate(10 82 166)">
    <!-- thick padded cushion behind the shell -->
    <ellipse cx="100" cy="171" rx="52" ry="58" fill="url(#cushionSide)"/>
    <ellipse cx="100" cy="171" rx="52" ry="58" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1.2"/>
    <path d="M128 128 C146 146 152 190 132 214" stroke="rgba(255,255,255,.10)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- shell -->
    <ellipse cx="82" cy="166" rx="50" ry="56" fill="url(#shell)"/>
    <!-- bevel ring -->
    <ellipse cx="80" cy="165" rx="38" ry="43" fill="url(#ring)"/>
    <!-- cap -->
    <ellipse cx="80" cy="165" rx="35" ry="40" fill="url(#cap)"/>
    <!-- soft specular on the cap -->
    <ellipse cx="68" cy="146" rx="16" ry="9" fill="rgba(255,255,255,.10)" transform="rotate(-30 68 146)"/>
    <!-- buttons on the shell rim -->
    <rect x="122" y="150" width="4" height="12" rx="2" fill="#2b2d31"/>
    <rect x="123" y="168" width="4" height="9" rx="2" fill="#2b2d31"/>
    <!-- rim highlight -->
    <path d="M44 140 C52 118 74 108 96 112" stroke="rgba(255,255,255,.22)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
